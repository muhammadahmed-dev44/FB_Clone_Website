<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/login.css">
    <link rel="shortcut icon" href="./Assets/fb logo.png" type="image/x-icon">
    <title>FB Login Page</title>
</head>
<body>
    <div class="container">
        <div class="left-box">
            <img src="../Assets/fb logo.png" alt="" class="fb-logo">
            <h1>Explore the things <span>You Love</span>.</h1>
            <img src="../Assets/Login-page-picture.webp" alt="" class="image">
        </div>

        <div class="right-box">
            <h3>Login in to Facebook</h3>
            <div class="email-input">
                <input type="email" required placeholder="Email address or mobile number">
            </div>
            <div class="password-input">
                <input type="password" required placeholder="Password">
            </div>
            <div class="buttons">
                <button type="submit" class="submit">Log In</button>
                <button type="button" class="Forgot-btn">Forgot Password ?</button>
            </div>

            <div>
                <!-- <button class="create-btn"><a href="sign_up.html">Create new account</a></button> -->
                <a href="sign_up.html"><button class="create-btn">Create new account</button></a>
            </div>
            <div class="metalogo">
                <img src="../Assets/meta image logo.png" alt="">
                <span>Meta</span>
            </div>
        </div>
    </div>
</body>
</html>
